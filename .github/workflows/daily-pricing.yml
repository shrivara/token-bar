name: Daily pricing release

on:
  schedule:
    # Check after models.dev's day has rolled over. A release is made only when
    # the normalized catalog differs from the snapshot on main.
    - cron: "17 09 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-pricing-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch current prices
        run: ./Scripts/update-model-pricing.sh
      - name: Check for price changes
        id: diff
        run: |
          if git diff --quiet -- Sources/TokenBarCore/Resources/model-pricing.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The pricing catalog has not changed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save updated catalog
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: model-pricing
          path: Sources/TokenBarCore/Resources/model-pricing.json
          retention-days: 1

  release:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: model-pricing
          path: .pricing-update
      - name: Apply prices and bump patch version
        id: version
        run: |
          cp .pricing-update/model-pricing.json Sources/TokenBarCore/Resources/model-pricing.json
          version=$(./Scripts/bump-patch-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: swift test
      - name: Build app bundle
        run: ./build.sh
      - name: Commit and tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/TokenBarCore/Resources/model-pricing.json \
                  Sources/token-bar/main.swift build.sh
          git commit -m "Update model pricing and release v${VERSION}"
          git tag "v${VERSION}"
          git push --atomic origin HEAD:main "v${VERSION}"
          echo "### Released v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
