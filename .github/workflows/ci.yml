name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - LICENSE
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - LICENSE

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        run: swift test
      - name: Verify generated app icon
        if: matrix.os == 'macos-14'
        run: |
          icon_dir=$(mktemp -d)
          ./Scripts/generate-app-icon.swift "$icon_dir/AppIcon.icns"
          cmp Assets/AppIcon.icns "$icon_dir/AppIcon.icns"
      - name: Build app bundle
        run: ./build.sh
      - name: Verify app bundle
        run: ./Scripts/verify-app.sh
